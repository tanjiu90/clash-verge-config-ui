<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
  <rect width="1100" height="520" fill="#f6f8fa"/>
  <text x="40" y="55" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#24292f">第三步：在 Clash Verge Rev 创建增强文件</text>
  <g font-family="Microsoft YaHei, Segoe UI, sans-serif">
    <rect x="60" y="105" width="980" height="340" rx="14" fill="#0d1117"/>
    <rect x="60" y="105" width="190" height="340" rx="14" fill="#161b22"/>
    <text x="95" y="160" font-size="20" fill="#c9d1d9">首页</text>
    <text x="95" y="210" font-size="20" fill="#c9d1d9">代理</text>
    <rect x="80" y="240" width="140" height="46" rx="8" fill="#0969da"/>
    <text x="150" y="270" font-size="20" text-anchor="middle" fill="#ffffff">订阅</text>
    <text x="95" y="330" font-size="20" fill="#c9d1d9">设置</text>
    <rect x="290" y="150" width="320" height="70" rx="10" fill="#21262d" stroke="#30363d"/>
    <text x="320" y="193" font-size="21" fill="#f0f6fc">示例订阅</text>
    <rect x="640" y="135" width="250" height="210" rx="10" fill="#f6f8fa"/>
    <text x="670" y="180" font-size="20" font-weight="700" fill="#24292f">右键菜单</text>
    <line x1="670" y1="198" x2="860" y2="198" stroke="#d0d7de"/>
    <text x="685" y="235" font-size="18" fill="#24292f">编辑代理组</text>
    <text x="685" y="275" font-size="18" fill="#24292f">编辑代理节点</text>
    <text x="685" y="315" font-size="18" fill="#24292f">编辑规则</text>
    <path d="M610 185h25" stroke="#f0f6fc" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="550" y="400" font-size="18" text-anchor="middle" fill="#8b949e">三个菜单分别打开一次，让 Clash Verge 生成增强配置文件</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#f0f6fc"/>
    </marker>
  </defs>
</svg>
