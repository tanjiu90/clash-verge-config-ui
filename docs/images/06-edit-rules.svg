<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
  <rect width="1100" height="560" fill="#f6f8fa"/>
  <text x="40" y="55" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#24292f">第五步：编辑规则</text>
  <g font-family="Microsoft YaHei, Segoe UI, sans-serif">
    <rect x="60" y="100" width="980" height="390" rx="14" fill="#111827"/>
    <rect x="85" y="130" width="170" height="330" rx="10" fill="#1f2937"/>
    <rect x="105" y="165" width="130" height="42" rx="8" fill="#374151"/>
    <text x="170" y="193" font-size="17" text-anchor="middle" fill="#ffffff">示例订阅</text>
    <rect x="285" y="130" width="720" height="56" rx="10" fill="#1f2937"/>
    <rect x="585" y="140" width="90" height="36" rx="8" fill="#0969da"/>
    <text x="630" y="164" font-size="16" text-anchor="middle" fill="#ffffff">规则</text>
    <rect x="310" y="215" width="260" height="230" rx="10" fill="#1f2937"/>
    <rect x="330" y="235" width="80" height="36" rx="8" fill="#0969da"/>
    <text x="370" y="259" font-size="15" text-anchor="middle" fill="#ffffff">前置</text>
    <rect x="430" y="235" width="110" height="36" rx="8" fill="#374151"/>
    <text x="485" y="259" font-size="15" text-anchor="middle" fill="#ffffff">添加前置</text>
    <rect x="330" y="295" width="210" height="50" rx="8" fill="#374151"/>
    <text x="435" y="326" font-size="15" text-anchor="middle" fill="#ffffff">DOMAIN-SUFFIX</text>
    <rect x="610" y="215" width="360" height="230" rx="10" fill="#1f2937"/>
    <text x="640" y="252" font-size="18" font-weight="700" fill="#ffffff">规则内容</text>
    <text x="640" y="295" font-size="16" fill="#d1d5db">类型：DOMAIN-SUFFIX</text>
    <text x="640" y="330" font-size="16" fill="#d1d5db">内容：example.com</text>
    <text x="640" y="365" font-size="16" fill="#d1d5db">策略：DIRECT</text>
    <rect x="840" y="390" width="90" height="38" rx="8" fill="#2da44e"/>
    <text x="885" y="415" font-size="16" text-anchor="middle" fill="#ffffff">保存</text>
    <text x="550" y="525" font-size="17" text-anchor="middle" fill="#57606a">规则建议放在前置，优先匹配。默认策略 DIRECT / REJECT / PASS 会排在前面。</text>
  </g>
</svg>
